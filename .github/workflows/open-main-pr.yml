name: Open Main PR

on:
  push:
    branches: [develop]

  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  open-main-pr:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Open develop to main PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          head_ref="$REPOSITORY_OWNER:develop"

          gh api "repos/$REPOSITORY/statuses/$head_sha" \
            -X POST \
            -f state=success \
            -f context=validate-pr \
            -f description="develop to main promotion validated" \
            -f target_url="$RUN_URL"

          existing_pr="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --base main \
              --head "$head_ref" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$existing_pr" ]; then
            echo "PR develop -> main already open: #$existing_pr"
            exit 0
          fi

          set +e
          create_output="$(
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head develop \
              --title "chore: promote develop to main" \
              --body "Automatic PR opened after a manual merge into develop." 2>&1
          )"
          create_status="$?"
          set -e

          echo "$create_output"

          if [ "$create_status" -eq 0 ]; then
            exit 0
          fi

          if echo "$create_output" | grep -qi "already exists"; then
            echo "PR develop -> main already exists."
            exit 0
          fi

          exit "$create_status"
