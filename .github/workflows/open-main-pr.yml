name: Abrir PR para Main

on:
  push:
    tags:
      - "promote/**"
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone ou release aprovado para promoção"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  open-main-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Gerar token do aplicativo de promoção
        id: promotion-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NEXORA_PROMOTION_APP_ID }}
          private-key: ${{ secrets.NEXORA_PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Nexora

      - name: Abrir PR de develop para main
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
          STATUS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MILESTONE_INPUT: ${{ inputs.milestone || github.ref_name }}
        run: |
          milestone="${MILESTONE_INPUT#promote/}"
          head_sha="$(git rev-parse HEAD)"
          head_ref="$REPOSITORY_OWNER:develop"

          GH_TOKEN="$STATUS_TOKEN" gh api "repos/$REPOSITORY/statuses/$head_sha" \
            -X POST \
            -f state=success \
            -f context=validate-pr \
            -f description="promoção de develop para main validada" \
            -f target_url="$RUN_URL"

          existing_pr="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --base main \
              --head "$head_ref" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$existing_pr" ]; then
            echo "PR develop -> main já está aberto: #$existing_pr"
            exit 0
          fi

          cat > /tmp/nexora-promotion-body.md <<'EOF'
          ## Resumo

          - promover para `main` as alterações aprovadas e mescladas manualmente em `develop` para o milestone/release solicitado.

          ## Validação

          - PR criado automaticamente após o acionamento explícito da promoção do milestone/release;
          - merge em `main` permanece manual e protegido pelos checks obrigatórios.
          EOF

          printf '\n## Milestone/release\n\n- %s\n' "$milestone" >> /tmp/nexora-promotion-body.md

          set +e
          create_output="$(
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head develop \
              --title "chore: promover $milestone para main" \
              --body-file /tmp/nexora-promotion-body.md 2>&1
          )"
          create_status="$?"
          set -e

          echo "$create_output"

          if [ "$create_status" -eq 0 ]; then
            exit 0
          fi

          if echo "$create_output" | grep -qi "already exists"; then
            echo "O PR develop -> main já existe."
            exit 0
          fi

          exit "$create_status"
