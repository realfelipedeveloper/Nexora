name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run affected test suite
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: pnpm test
      - name: Run release coverage suite
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: pnpm test:coverage
      - run: pnpm build
      - name: Install release browser
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run release end-to-end suite
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: pnpm playwright
      - name: Scan tracked sources for secrets
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: pnpm secret:scan
      - name: Audit production dependencies
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: pnpm run sca
      - name: Generate release SBOM
        if: github.event_name == 'push' || github.base_ref == 'main'
        run: pnpm run sbom
