name: Regras de PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validar Git Flow, Conventional Commits e PT-BR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          conventional='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          portuguese_subject=': (adicionar|ajustar|atualizar|automatizar|centralizar|corrigir|criar|documentar|exigir|habilitar|implementar|incluir|integrar|melhorar|migrar|otimizar|permitir|promover|proteger|publicar|refatorar|remover|renomear|reorganizar|restaurar|restringir|sincronizar|testar|traduzir|usar|validar)( |$)'
          work_branch='^(feature|fix|refactor|test|docs|chore|hotfix)/[a-z0-9._/-]+$'

          if [[ ! "$PR_TITLE" =~ $conventional ]]; then
            echo "O título do PR deve seguir Conventional Commits."
            echo "Recebido: $PR_TITLE"
            echo "Exemplo: feat(cms): adicionar editor de tipos de conteúdo"
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ $portuguese_subject ]]; then
            echo "Após o prefixo Conventional Commits, o título deve começar com uma ação em PT-BR."
            echo "Recebido: $PR_TITLE"
            echo "Exemplo: fix(api): corrigir conflito de versão"
            exit 1
          fi

          if [[ "$PR_BODY" != *"## Resumo"* || "$PR_BODY" != *"## Validação"* ]]; then
            echo "O corpo do PR deve estar em PT-BR e conter as seções '## Resumo' e '## Validação'."
            exit 1
          fi

          case "$BASE_REF" in
            develop)
              if [[ ! "$HEAD_REF" =~ $work_branch ]]; then
                echo "PRs para develop devem vir de feature/*, fix/*, refactor/*, test/*, docs/*, chore/* ou hotfix/*."
                echo "Branch recebida: $HEAD_REF"
                exit 1
              fi
              ;;
            main)
              if [[ "$HEAD_REF" != "develop" ]]; then
                echo "Somente develop pode abrir PRs para main."
                echo "Branch recebida: $HEAD_REF"
                exit 1
              fi
              ;;
            *)
              echo "Branch base não suportada: $BASE_REF"
              echo "Use develop para branches de trabalho e main somente para promoção de develop."
              exit 1
              ;;
          esac

          echo "As regras do PR foram validadas."
