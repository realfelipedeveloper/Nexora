name: nexora

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXORA_TARGET: "@nexora/web"
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PUBLIC_PORT:-48110}:48110"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:48110 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXORA_TARGET: "@nexora/cms"
    environment:
      CORE_API_INTERNAL_URL: http://core-api:48120
      NODE_ENV: production
    ports:
      - "${CMS_PORT:-48111}:48111"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:48111 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXORA_TARGET: "@nexora/core-api"
    environment:
      NODE_ENV: production
      CORE_API_PORT: 48120
      DATABASE_URL: postgresql://nexora:nexora_dev_password@postgres:5432/nexora?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://nexora:nexora_dev_password@rabbitmq:5672
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "${CORE_API_PORT:-48120}:48120"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:48120/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXORA_TARGET: "@nexora/notification-api"
    environment:
      NOTIFICATION_API_PORT: 48121
      RABBITMQ_URL: amqp://nexora:nexora_dev_password@rabbitmq:5672
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    ports:
      - "${NOTIFICATION_API_PORT:-48121}:48121"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:48121/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXORA_TARGET: "@nexora/worker"
    environment:
      RABBITMQ_URL: amqp://nexora:nexora_dev_password@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      - "${POSTGRES_PORT:-48130}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-48140}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexora
      RABBITMQ_DEFAULT_PASS: nexora_dev_password
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-nexora_dev_cookie}
    ports:
      - "${RABBIT_AMQP_PORT:-48150}:5672"
      - "${RABBIT_UI_PORT:-48151}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nexora_dev_password}
    ports:
      - "${MINIO_PORT:-48160}:9000"
      - "${MINIO_UI_PORT:-48161}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-48170}:1025"
      - "${MAILPIT_UI_PORT:-48171}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "${CLAMAV_PORT:-48180}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - clamav-data:/var/lib/clamav

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-48190}:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: nexora_dev_password
    ports:
      - "${GRAFANA_PORT:-48191}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-data:
  prometheus-data:
  grafana-data:
