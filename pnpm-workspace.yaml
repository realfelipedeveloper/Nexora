packages:
  - "apps/cms"
  - "apps/web"
  - "services/*"
  - "packages/*"

overrides:
  deepmerge-ts: 8.0.2
  multer: 2.3.0
  mysql2: 3.24.4
  path-to-regexp: 8.4.2

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  core-js-pure: true
  cpu-features: true
  esbuild: true
  nx: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true

minimumReleaseAgeExclude:
  - "@next/env@16.3.5"
  - "@next/swc-darwin-arm64@16.3.5"
  - "@next/swc-darwin-x64@16.3.5"
  - "@next/swc-linux-arm64-gnu@16.3.5"
  - "@next/swc-linux-arm64-musl@16.3.5"
  - "@next/swc-linux-x64-gnu@16.3.5"
  - "@next/swc-linux-x64-musl@16.3.5"
  - "@next/swc-win32-arm64-msvc@16.3.5"
  - "@next/swc-win32-x64-msvc@16.3.5"
  - next@16.3.5
