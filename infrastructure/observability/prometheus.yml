global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: nexora-core-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:48120"]
  - job_name: nexora-notification-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:48121"]
